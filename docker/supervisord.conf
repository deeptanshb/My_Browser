[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:xvfb]
command=Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset
autostart=true
autorestart=true
priority=100
startsecs=2
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb_err.log

[program:x11vnc]
command=x11vnc -display :99 -nopw -listen 0.0.0.0 -forever -shared -noxdamage -cursor arrow
autostart=true
autorestart=true
priority=200
startsecs=4
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc_err.log

[program:novnc]
command=websockify --web=/usr/share/novnc/ 6080 localhost:5900
autostart=true
autorestart=true
priority=300
startsecs=5
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc_err.log

[program:cors_proxy]
command=python3 /app/ollama_cors_proxy.py
directory=/app
autostart=true
autorestart=true
priority=400
stdout_logfile=/var/log/supervisor/cors_proxy.log
stderr_logfile=/var/log/supervisor/cors_proxy_err.log

[program:mybrowser]
command=python3 /app/launch_mybrowser.py
directory=/app
environment=DISPLAY=":99",QT_OPENGL="software",QTWEBENGINE_DISABLE_SANDBOX="1",QTWEBENGINE_CHROMIUM_FLAGS="--disable-gpu --disable-software-rasterizer --no-sandbox --disable-dev-shm-usage",QT_STYLE_OVERRIDE="fusion"
autostart=true
autorestart=true
priority=500
startsecs=10
stdout_logfile=/var/log/supervisor/mybrowser.log
stderr_logfile=/var/log/supervisor/mybrowser_err.log
